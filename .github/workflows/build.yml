name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Build
        run: dotnet build PakuPort.slnx -c Release

      - name: Unit tests
        run: dotnet test tests/PakuPort.Tests -c Release --no-build

      - name: The sample rebuilds byte-identical
        shell: pwsh
        run: |
          dotnet run -c Release --project samples/catch/src -- $env:RUNNER_TEMP/CATCH.COM
          if ((Get-FileHash $env:RUNNER_TEMP/CATCH.COM).Hash -ne (Get-FileHash samples/catch/dos/CATCH.COM).Hash) {
            throw "samples/catch/src does not rebuild samples/catch/dos/CATCH.COM"
          }

      - name: The PAKU_* index is up to date
        run: python tools/gen_palancas.py --check

# The end-to-end self-test (tools/selftest.py) runs the ported game with a hidden window and is
# meant to be run locally before every contribution; see CONTRIBUTING.md.
