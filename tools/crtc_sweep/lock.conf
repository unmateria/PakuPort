# Oracle conf for the CRTC write-protect probe (LOCK.COM). Machine svga_s3. The result
# is written to a FILE (LOCK.BIN in the mounted dir).
# Run dosbox-x from the repository root so the relative mount resolves.
[sdl]
fullscreen=false
output=surface
showmenu=false
priority=normal,normal
[cpu]
core=normal
cputype=386
cycles=3000
[dosbox]
machine=svga_s3
[autoexec]
mount c "tools\crtc_sweep"
c:
LOCK.COM
exit
