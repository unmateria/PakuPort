# Oracle conf for the mode 13h START ADDRESS probe (SA13.COM). Unlike the other CRTC
# probes the result is what is SHOWN, which a COM cannot read back, so it must be captured
# from outside as a raw 320x200 VGA frame. The COM ends in `jmp $` to keep the screen still.
# Run dosbox-x from the repository root so the relative mount resolves.
[sdl]
fullscreen=false
output=surface
showmenu=false
priority=normal,normal
[cpu]
core=normal
cputype=386
cycles=3000
[dosbox]
machine=svga_s3
[autoexec]
mount c "tools\crtc_sweep"
c:
SA13.COM
