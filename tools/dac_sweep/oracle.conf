# Oracle conf for the DAC sweep (DAC.COM). Machine svga_s3, same as the other platform
# sweeps. The result is written to a FILE (DAC.BIN in the mounted dir).
# Run dosbox-x from the repository root so the relative mount resolves.
[sdl]
fullscreen=false
output=surface
showmenu=false
priority=normal,normal
[cpu]
core=normal
cputype=386
cycles=3000
[dosbox]
machine=svga_s3
[autoexec]
mount c "tools\dac_sweep"
c:
DAC.COM
exit
