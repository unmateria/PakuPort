# Speed probe on the oracle (stock DOSBox-X). Run dosbox-x from the repo root.
# [cpu] must stay core=normal, cputype=386, cycles=315: changing any of them invalidates
# the comparison. The result is written to a FILE (REPTEST.BIN in the mounted dir).
[sdl]
fullscreen=false
output=surface
showmenu=false
priority=normal,normal
[cpu]
core=normal
cputype=386
cycles=315
[dosbox]
machine=svga_s3
[autoexec]
mount c "tools\speed_probe"
c:
REPTEST.COM
exit
