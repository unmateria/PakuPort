# Oracle conf for BDAV.COM: the video BIOS Data Area left by the BIOS after each set-mode.
# Run dosbox-x from the repository root so the relative mount resolves.
[sdl]
fullscreen=false
output=surface
showmenu=false
priority=normal,normal
[cpu]
core=normal
cputype=386
cycles=3000
[dosbox]
machine=svga_s3
[autoexec]
mount c "tools\bda_video"
c:
BDAV.COM
