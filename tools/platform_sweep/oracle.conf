# Platform sweep oracle: same machine as the game oracle (svga_s3).
# The result comes out as a file (RESULT.BIN in the mounted dir).
# Run from the repo root: dosbox-x -conf tools\platform_sweep\oracle.conf
[sdl]
fullscreen=false
output=surface
showmenu=false
priority=normal,normal
[cpu]
core=normal
cputype=386
cycles=3000
[dosbox]
machine=svga_s3
[sblaster]
sbtype=sb2
sbbase=220
irq=7
dma=1
[autoexec]
mount c "tools\platform_sweep"
c:
TEST.COM
exit
