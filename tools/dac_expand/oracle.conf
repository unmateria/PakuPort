# Oracle conf for DACX.COM: the colour reference for the 6-bit DAC expansion.
# The result is a screen capture. Run dosbox-x from the repository root.
[sdl]
fullscreen=false
output=surface
showmenu=false
priority=normal,normal
[cpu]
core=normal
cputype=386
cycles=3000
[dosbox]
machine=svga_s3
[autoexec]
mount c "tools\dac_expand"
c:
DACX.COM
