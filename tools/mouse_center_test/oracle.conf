# Ground truth for the mouse reset centring probe (stock DOSBox-X).
# Run dosbox-x from the repo root. The result is written to a FILE (MCEN.BIN in the mounted dir).
[sdl]
fullscreen=false
output=surface
showmenu=false
priority=normal,normal
[cpu]
core=normal
cputype=386
cycles=3000
[dosbox]
machine=svga_s3
[autoexec]
mount c "tools\mouse_center_test"
c:
MCEN.COM
exit
